services:
  openclaw:
    image: alpine/openclaw:2026.2.3
    environment:
      TERM: xterm-256color
      # BROWSER: echo
    volumes:
      - ${OPENCLAW_CONFIG_DIR}:/root/.openclaw
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      # - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    init: true
    restart: always
    user: root
    entrypoint: ["node", "dist/index.js"]
    command:
      [
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
